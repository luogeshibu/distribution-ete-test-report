<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>配网 ETE 历史报表</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--line:#d9e2df;--text:#1f2d29;--muted:#667570;--accent:#0b6b55;--accent2:#e9f5f1;--bad:#b42318;--draft:#9a6700;--draft-bg:#fff4ce;--shadow:0 4px 18px rgba(17,49,41,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif;font-size:14px}.topbar{height:64px;background:#123f34;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:var(--shadow)}.topbar h1{font-size:19px;margin:0;font-weight:650}.topbar .sub{font-size:12px;opacity:.75;margin-top:3px}.topbar a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.4);padding:8px 14px;border-radius:7px}.topnav{display:flex;gap:8px;align-items:center}.lang-toggle{display:inline-flex;border:1px solid rgba(255,255,255,.4);border-radius:7px;overflow:hidden}.lang-toggle button{height:34px;border:0;background:transparent;color:#fff;padding:0 10px;cursor:pointer;opacity:.78}.lang-toggle button.active{background:rgba(255,255,255,.18);font-weight:700;opacity:1}.wrap{max-width:1580px;margin:22px auto;padding:0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.filters{display:grid;grid-template-columns:repeat(8,minmax(120px,1fr));gap:12px;align-items:end}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;height:36px;border:1px solid #cbd7d3;border-radius:6px;padding:0 9px;background:#fff}.actions{display:flex;gap:8px}.btn{height:36px;border:1px solid #b9cbc5;border-radius:6px;background:#fff;padding:0 14px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.summary{display:flex;justify-content:space-between;align-items:center;margin:3px 0 12px;color:var(--muted)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;min-width:1450px;background:#fff}th,td{border-bottom:1px solid #e4ebe8;padding:9px 10px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#edf5f2;color:#314a43;font-size:12px;white-space:nowrap}tr:hover td{background:#fbfdfc}.devices{display:flex;flex-direction:column;gap:4px}.device{font-weight:600}.hier{font-size:12px;color:var(--muted)}.tag{display:inline-block;padding:2px 7px;border-radius:999px;background:var(--accent2);color:var(--accent);font-size:12px;white-space:nowrap}.tag.fail{background:#feeceb;color:var(--bad)}.tag.empty{background:#f1f3f2;color:#6b7773}.tag.draft{background:var(--draft-bg);color:var(--draft)}.op{display:flex;flex-wrap:wrap;gap:6px}.op a,.op button{font:inherit;color:var(--accent);text-decoration:none;border:1px solid #c5d8d1;border-radius:5px;padding:4px 7px;white-space:nowrap;background:#fff;cursor:pointer}.op a.continue{background:var(--accent);border-color:var(--accent);color:#fff}.op button.pdf-action{background:#f7fbfa}.op button:disabled{opacity:.55;cursor:wait}.action-msg{margin-right:12px;color:var(--accent)}.action-msg.error{color:var(--bad)}.empty{text-align:center;padding:34px;color:var(--muted)}.error{color:var(--bad)}@media(max-width:1100px){.filters{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="topbar">
  <div><h1 data-i18n="hdrTitle">配网设备信号端到端测试 · 历史报表</h1><div class="sub" data-i18n="hdrSub">Distribution ETE Test Report · Central Archive</div></div>
  <div class="topnav">
    <a href="/?network=distribution" data-i18n="navTest">ETE 测试</a>
    <a href="/dashboard" data-i18n="navDashboard">测试总览</a>
    <div class="lang-toggle" aria-label="Language"><button type="button" id="lang-zh" class="active">中文</button><button type="button" id="lang-en">EN</button></div>
  </div>
</header>
<main class="wrap">
  <section class="card">
    <div class="filters">
      <div class="field"><label data-i18n="dateFrom">调试日期 From</label><input type="date" id="date-from"></div>
      <div class="field"><label data-i18n="dateTo">调试日期 To</label><input type="date" id="date-to"></div>
      <div class="field"><label data-i18n="substation">变电站</label><input id="substation" data-i18n-placeholder="phSubstation" placeholder="例如 EEH"></div>
      <div class="field"><label data-i18n="feeder">馈线</label><input id="feeder" data-i18n-placeholder="phFeeder" placeholder="例如 AH333"></div>
      <div class="field"><label data-i18n="device">设备</label><input id="device" data-i18n-placeholder="phDevice" placeholder="RMU / ADMS GSS FID"></div>
      <div class="field"><label data-i18n="lead">测试负责人</label><input id="lead" data-i18n-placeholder="phLead" placeholder="姓名"></div>
      <div class="field"><label data-i18n="verdict">总评</label><select id="verdict"><option value="">全部</option><option value="pass">通过 / Pass</option><option value="conditional">Pass with comments</option><option value="fail">不通过 / Fail</option></select></div>
      <div class="field"><label data-i18n="status">状态</label><select id="status"><option value="">全部</option><option value="draft">草稿 / 未完成</option><option value="final">正式 / 已完成</option></select></div>
    </div>
    <div class="actions" style="margin-top:14px"><button class="btn primary" id="search" data-i18n="query">查询</button><button class="btn" id="reset" data-i18n="reset">重置</button></div>
  </section>
  <section class="card">
    <div class="summary"><span id="count">正在加载…</span><span><span id="action-msg" class="action-msg"></span><span data-i18n="dataSource">数据来自服务端持久化目录 data/</span></span></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th data-i18n="thSaved">最后保存时间</th><th data-i18n="status">状态</th><th data-i18n="thDeviceHierarchy">设备层级 / 设备</th><th data-i18n="lead">测试负责人</th><th data-i18n="testers">参测人员</th><th data-i18n="verdict">总评</th><th data-i18n="reportNo">报告编号</th><th data-i18n="version">版本</th><th data-i18n="actions">操作</th></tr></thead>
        <tbody id="rows"><tr><td colspan="9" class="empty">正在加载…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LANG_KEY='distribution_rmu_e2e_report_search_lang';
const WINDOW_LANG_MARKER='__distribution_ete_lang__=';
const LANG_COOKIE='distribution_ete_language';
function validLanguage(value){return value==='zh'||value==='en'}
function readWindowLanguage(){try{for(const part of String(window.name||'').split('|')){if(part.startsWith(WINDOW_LANG_MARKER)){const value=part.slice(WINDOW_LANG_MARKER.length);if(validLanguage(value))return value}}}catch(e){}return ''}
function writeWindowLanguage(value){if(!validLanguage(value))return;try{const parts=String(window.name||'').split('|').filter(part=>part&&!part.startsWith(WINDOW_LANG_MARKER));parts.push(WINDOW_LANG_MARKER+value);window.name=parts.join('|')}catch(e){}}
function readCookieLanguage(){try{const prefix=LANG_COOKIE+'=';for(const raw of String(document.cookie||'').split(';')){const item=raw.trim();if(!item.startsWith(prefix))continue;const value=decodeURIComponent(item.slice(prefix.length));if(validLanguage(value))return value}}catch(e){}return ''}
function writeCookieLanguage(value){if(!validLanguage(value))return;try{document.cookie=LANG_COOKIE+'='+encodeURIComponent(value)+'; Path=/; Max-Age=31536000; SameSite=Lax'}catch(e){}}
function readLocalLanguage(key){try{const value=localStorage.getItem(key);return validLanguage(value)?value:''}catch(e){return ''}}
function createLanguageController(key){let current=readWindowLanguage()||readCookieLanguage()||readLocalLanguage(key)||'zh';function mirror(value){if(!validLanguage(value))return;writeWindowLanguage(value);writeCookieLanguage(value);try{localStorage.setItem(key,value)}catch(e){}}mirror(current);return{get(){return current},select(next){if(!validLanguage(next))return current;current=next;mirror(current);return current},sync(next){if(!validLanguage(next))return current;current=next;mirror(current);return current}}}
const LANGUAGE_CONTROLLER=window.DistributionLanguageController||createLanguageController(LANG_KEY);
window.DistributionLanguageController=LANGUAGE_CONTROLLER;
try{sessionStorage.removeItem(LANG_KEY+'_nav')}catch(e){}
const I18N={
  zh:{
    title:'配网 ETE 历史报表',hdrTitle:'配网设备信号端到端测试 · 历史报表',hdrSub:'配网 ETE 测试报告 · 中央归档',navTest:'ETE 测试',navDashboard:'测试总览',
    dateFrom:'调试日期起',dateTo:'调试日期止',substation:'变电站',feeder:'馈线',device:'设备',lead:'测试负责人',testers:'参测人员',verdict:'总评',status:'状态',
    phSubstation:'例如 EEH',phFeeder:'例如 AH333',phDevice:'RMU / ADMS GSS FID',phLead:'姓名',all:'全部',pass:'通过',conditional:'通过（带备注）',fail:'不通过',draft:'草稿 / 未完成',final:'正式 / 已完成',
    query:'查询',reset:'重置',dataSource:'数据来自服务端持久化目录 data/',thSaved:'最后保存时间',thDeviceHierarchy:'设备层级 / 设备',reportNo:'报告编号',version:'版本',actions:'操作',
    loading:'正在加载…',count:n=>`共 ${n} 份历史记录`,noMatch:'没有匹配的历史报表',historyFail:'历史报表查询失败',continueTest:'继续测试',view:'查看',viewPdf:'查看 PDF',downloadPdf:'下载 PDF',regeneratePdf:'重新生成 PDF',generatePdf:'生成 PDF',downloadHtml:'下载 HTML',downloadJson:'下载 JSON',
    generating:'生成中…',generatingMsg:'正在根据当前历史快照生成 PDF…',generatedDraft:'PDF 已生成，记录仍保持“草稿 / 未完成”状态。',generated:'PDF 已生成。',pdfFail:'PDF 生成失败'
  },
  en:{
    title:'Distribution ETE Test History',hdrTitle:'Distribution Device End-to-End Test · History',hdrSub:'Distribution ETE Test Report · Central Archive',navTest:'ETE Test',navDashboard:'Test Overview',
    dateFrom:'Test Date From',dateTo:'Test Date To',substation:'Substation',feeder:'Feeder',device:'Device',lead:'Test Lead',testers:'Testers',verdict:'Overall Result',status:'Status',
    phSubstation:'e.g. EEH',phFeeder:'e.g. AH333',phDevice:'RMU / ADMS GSS FID',phLead:'Name',all:'All',pass:'Pass',conditional:'Pass with comments',fail:'Fail',draft:'Draft / Incomplete',final:'Final / Completed',
    query:'Search',reset:'Reset',dataSource:'Data source: server persistent directory data/',thSaved:'Last Saved',thDeviceHierarchy:'Device Hierarchy / Device',reportNo:'Report No.',version:'Version',actions:'Actions',
    loading:'Loading…',count:n=>`${n} historical report${n===1?'':'s'}`,noMatch:'No matching historical reports',historyFail:'Failed to query test history',continueTest:'Continue Test',view:'View',viewPdf:'View PDF',downloadPdf:'Download PDF',regeneratePdf:'Regenerate PDF',generatePdf:'Generate PDF',downloadHtml:'Download HTML',downloadJson:'Download JSON',
    generating:'Generating…',generatingMsg:'Generating PDF from the current archived snapshot…',generatedDraft:'PDF generated. The record remains Draft / Incomplete.',generated:'PDF generated.',pdfFail:'PDF generation failed'
  }
};
let lang=LANGUAGE_CONTROLLER.get();let lastItems=null;
function t(key,...args){const v=I18N[lang][key];return typeof v==='function'?v(...args):(v??key)}
function fillSelects(){
  const verdict=$('verdict'),vv=verdict.value;verdict.innerHTML=`<option value="">${esc(t('all'))}</option><option value="pass">${esc(t('pass'))}</option><option value="conditional">${esc(t('conditional'))}</option><option value="fail">${esc(t('fail'))}</option>`;verdict.value=vv;
  const status=$('status'),sv=status.value;status.innerHTML=`<option value="">${esc(t('all'))}</option><option value="draft">${esc(t('draft'))}</option><option value="final">${esc(t('final'))}</option>`;status.value=sv;
}
function applyI18n(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=t('title');document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=t(el.dataset.i18nPlaceholder));$('lang-zh').classList.toggle('active',lang==='zh');$('lang-en').classList.toggle('active',lang==='en');fillSelects();}
function renderLanguage(){applyI18n();if(lastItems!==null)renderItems(lastItems);else{$('count').textContent=t('loading');$('rows').innerHTML=`<tr><td colspan="9" class="empty">${esc(t('loading'))}</td></tr>`}}
function setLang(next){if(next!=='zh'&&next!=='en')return;lang=LANGUAGE_CONTROLLER.select(next);renderLanguage()}
function syncLang(next){if(next!=='zh'&&next!=='en')return;lang=LANGUAGE_CONTROLLER.sync(next);renderLanguage()}
window.addEventListener('storage',(event)=>{if(event.key!==LANG_KEY)return;const next=event.newValue;if((next==='zh'||next==='en')&&next!==lang)syncLang(next)});
function verdict(v){if(v==='pass')return `<span class="tag">${esc(t('pass'))}</span>`;if(v==='conditional')return `<span class="tag">${esc(t('conditional'))}</span>`;if(v==='fail')return `<span class="tag fail">${esc(t('fail'))}</span>`;return '<span class="tag empty">—</span>'}
function statusTag(x){return Number(x.is_draft)===1?`<span class="tag draft">${esc(t('draft'))}</span>`:`<span class="tag">${esc(t('final'))}</span>`}
function hierarchy(d){const h=[d.subcontrolarea_name,d.substation_name,d.feeder_name].filter(Boolean).join(' / ');return `<div class="device">${esc(d.display_name||d.rmu_name||'—')}</div><div class="hier">${esc(h||'—')}</div>`}
function params(){const p=new URLSearchParams();[['date_from','date-from'],['date_to','date-to'],['substation','substation'],['feeder','feeder'],['device','device'],['lead','lead'],['verdict','verdict'],['status','status']].forEach(([k,id])=>{const v=$(id).value.trim();if(v)p.set(k,v)});return p}
function resumeSelector(d){const rmu=String(d.rmu_name||'').trim();const display=String(d.display_name||'').trim();if(display&&display!==rmu)return 'fid:'+display;const scope=[d.subcontrolarea_name,d.substation_name,d.feeder_name].map(v=>String(v||'').trim()).filter(Boolean);if(scope.length&&rmu)return 'fid:'+scope.concat([rmu]).join('-');return rmu}
function continueUrl(x,devices){const p=new URLSearchParams();p.set('network','distribution');const names=devices.map(resumeSelector).filter(Boolean);if(names.length)p.set('rmu',names.join(','));p.set('resume',x.report_uuid);return '/?'+p.toString()}
function setActionMessage(message,isError=false){const el=$('action-msg');el.textContent=message||'';el.classList.toggle('error',!!isError)}
function renderItems(items){lastItems=items;$('count').textContent=t('count',items.length);const body=$('rows');if(!items.length){body.innerHTML=`<tr><td colspan="9" class="empty">${esc(t('noMatch'))}</td></tr>`;return}body.innerHTML=items.map(x=>{const devices=Array.isArray(x.devices)?x.devices:[];const deviceHtml=devices.length?`<div class="devices">${devices.map(hierarchy).join('')}</div>`:'—';const id=encodeURIComponent(x.report_uuid);const view=`/api/reports/${id}/view`;const pdf=x.pdf_available?`<a target="_blank" href="${view}">${esc(t('viewPdf'))}</a><a href="/api/reports/${id}/download?format=pdf">${esc(t('downloadPdf'))}</a><button type="button" class="pdf-action" data-report="${id}">${esc(t('regeneratePdf'))}</button>`:`<button type="button" class="pdf-action" data-report="${id}">${esc(t('generatePdf'))}</button>`;const resume=Number(x.is_draft)===1?`<a class="continue" href="${continueUrl(x,devices)}">${esc(t('continueTest'))}</a>`:'';const when=x.updated_at||x.created_at||'';return `<tr><td>${esc(when)}</td><td>${statusTag(x)}</td><td>${deviceHtml}</td><td>${esc(x.lead||'—')}</td><td>${esc(x.testers||'—')}</td><td>${verdict(x.verdict_summary)}</td><td>${esc(x.report_no||'—')}</td><td>${esc(x.software_version||'—')}</td><td><div class="op">${resume}<a target="_blank" href="${view}">${esc(t('view'))}</a>${pdf}<a href="/api/reports/${id}/download?format=html">${esc(t('downloadHtml'))}</a><a href="/api/reports/${id}/download?format=json">${esc(t('downloadJson'))}</a></div></td></tr>`}).join('')}
async function generatePdf(reportUuid,button){if(!reportUuid||button.disabled)return;const oldText=button.textContent;button.disabled=true;button.textContent=t('generating');setActionMessage(t('generatingMsg'));try{const r=await fetch(`/api/reports/${encodeURIComponent(reportUuid)}/generate-pdf`,{method:'POST'});let data={};try{data=await r.json()}catch(e){}if(!r.ok||data.ok===false)throw new Error(data.error||t('pdfFail'));setActionMessage(data.is_draft?t('generatedDraft'):t('generated'));await load()}catch(e){console.error('PDF generation failed',e);setActionMessage(t('pdfFail'),true);button.disabled=false;button.textContent=oldText}}
async function load(){const body=$('rows');lastItems=null;$('count').textContent=t('loading');body.innerHTML=`<tr><td colspan="9" class="empty">${esc(t('loading'))}</td></tr>`;try{const r=await fetch('/api/reports?'+params().toString(),{cache:'no-store'});const data=await r.json();if(!r.ok||data.ok===false)throw new Error(data.error||t('historyFail'));const items=Array.isArray(data.items)?data.items:[];renderItems(items)}catch(e){console.error('history query failed',e);$('count').innerHTML=`<span class="error">${esc(t('historyFail'))}</span>`;body.innerHTML=`<tr><td colspan="9" class="empty error">${esc(t('historyFail'))}</td></tr>`}}
$('rows').addEventListener('click',e=>{const button=e.target.closest('button.pdf-action[data-report]');if(!button)return;generatePdf(decodeURIComponent(button.dataset.report||''),button)});
$('search').onclick=load;$('reset').onclick=()=>{document.querySelectorAll('.filters input').forEach(x=>x.value='');document.querySelectorAll('.filters select').forEach(x=>x.value='');load()};document.querySelectorAll('.filters input,.filters select').forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')load()}));
$('lang-zh').onclick=()=>setLang('zh');$('lang-en').onclick=()=>setLang('en');applyI18n();load();
</script>
</body></html>
